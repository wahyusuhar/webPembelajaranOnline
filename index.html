<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/64d58efce2.js"
      crossorigin="anonymous"
    ></script>
    <link href="assets/img/laptop.png" rel="icon">
    <link rel="stylesheet" href="login.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Login & Register</title>
  </head>
  <body>


    
    <div class="container">
      <div class="forms-container">
        <div class="signin-signup">
          <form action="home.html" class="sign-in-form" id="login-form">
            <h2 class="title">Sign in</h2>
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" id="login-username" placeholder="Username" autocomplete="username" />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
            </div>
            <input type="submit" value="Login" class="btn solid" id="login-submit-btn" />
            <p class="social-text">Atau masuk dengan</p>
            <div class="social-media">
              <button type="button" class="google-btn" id="google-login-btn">
                <i class="fab fa-google"></i>
                <span>Masuk dengan Google</span>
              </button>
            </div>
          </form>

          <form action="home.html" class="sign-up-form" id="register-form">
            <h2 class="title">Sign up</h2>
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" id="register-username" placeholder="Username" autocomplete="username" />
            </div>
            <div class="input-field">
              <i class="fas fa-envelope"></i>
              <input type="email" id="register-email" placeholder="Email" autocomplete="email" />
            </div>
            <div class="input-field">
              <i class="fas fa-lock"></i>
              <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" />
            </div>
            <input type="submit" class="btn" value="Sign up" id="register-submit-btn" />
            <p class="social-text">Atau daftar dengan</p>
            <div class="social-media">
              <button type="button" class="google-btn" id="google-signup-btn">
                <i class="fab fa-google"></i>
                <span>Daftar dengan Google</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="panels-container">
        <div class="panel left-panel">
            <div class="content">
                <h3>Baru di sini?</h3>
                <p>
                    Daftarkan akun Anda untuk mulai belajar dan mengakses materi pembelajaran di Web Pembelajaran Online.
                </p>
                <button class="btn transparent" id="sign-up-btn">
                    Daftar
                </button>
            </div>
            <img src="./assets/img/log.svg" class="image" alt="Daftar" />
        </div>
        <div class="panel right-panel">
            <div class="content">
                <h3>Sudah bergabung?</h3>
                <p>
                    Masuk ke akun Anda untuk melanjutkan pembelajaran dan mengakses fitur lainnya di Web Pembelajaran Online.
                </p>
                <button class="btn transparent" id="sign-in-btn">
                    Masuk
                </button>
            </div>
            <img src="./assets/img/register.svg" class="image" alt="Masuk" />
        </div>
    </div>
    
    </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="login.js"></script>
  </body>
</html>
